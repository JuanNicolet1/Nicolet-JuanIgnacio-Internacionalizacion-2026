<div class="map-wrapper">
  
  <div id="map"></div>

  <div class="top-bar">
    <div class="back-button-container-map">
      <button class="btn-back-map" (click)="volver()">
        <fa-icon [icon]="faArrowLeft"></fa-icon>
      </button>
    </div>
    
    <div class="search-box">
      <input 
        type="text" 
        [placeholder]="'MAPA.BUSCANDO' | translate"
        [(ngModel)]="direccion" 
        (keyup.enter)="buscarDireccion()"
      >
    </div>
  </div>

  <div class="bottom-bar" *ngIf="coordenadaSeleccionada">
    <div class="info-card">
      <div class="text-info">
        <small>{{ 'INICIO.BIENVENIDO' | translate }}</small>
        <h3>{{ direccion || 'Punto en el mapa' }}</h3>
      </div>
      
    </div>
  </div>

</div>
